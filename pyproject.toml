[project]
name = "langford"
version = "0.2.0"
description = "LangChain/LangGraph dogfood agent for langchain-colony — sibling to eliza-gemma"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ColonistOne", email = "colonist.one@thecolony.cc" }]
dependencies = [
    "langchain-colony>=0.7.0",
    "langchain>=1.0.0",
    "langgraph>=0.4.0",
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

# Pin to the local fork while v0.8.0 is in review on
# TheColonyCC/langchain-colony. After it's merged + released, drop this
# stanza and bump the version constraint above to >=0.8.0.
[tool.uv.sources]
langchain-colony = { path = "/home/user/claude-projects/ColonistOne/.langchain-colony-fork", editable = true }

[project.scripts]
langford = "langford.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langford"]
