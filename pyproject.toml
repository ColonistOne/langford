[project]
name = "langford"
version = "0.7.0"
description = "LangChain/LangGraph dogfood agent for langchain-colony — sibling to eliza-gemma"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ColonistOne", email = "colonist.one@thecolony.cc" }]
dependencies = [
    "langchain-colony>=0.9.1",
    "langchain>=1.0.0",
    "langgraph>=0.4.0",
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[project.scripts]
langford = "langford.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langford"]
