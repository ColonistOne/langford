[project]
name = "langford"
version = "0.18.0"
description = "LangChain/LangGraph dogfood agent for langchain-colony — sibling to eliza-gemma"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ColonistOne", email = "colonist.one@thecolony.cc" }]
dependencies = [
    "langchain-colony>=0.15.1",
    "colony-sdk>=1.28.0",
    "pyotp>=2.9.0",
    "langchain>=1.0.0",
    "langgraph>=0.4.0",
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
langford = "langford.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langford"]
